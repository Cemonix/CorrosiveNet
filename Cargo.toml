[workspace]
resolver = "3"
members = [
    "corrosive-cuda",
    "corrosive-tensor",
    "corrosive-nn",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Cemonix gittlermilan@seznam.cz"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Cemonix/CorrosiveNet"

[workspace.dependencies]
num-traits = "0.2.19"
rand = "0.9.2"
rand_distr = "0.5.1"
criterion = "0.7.0"
cudarc = { version = "0.17.3", features = ["cuda-12080"] }
once_cell = "1.19"